[project]
name = "shiny-apps"
version = "0.1.0"
description = "Every Shiny app hosted on yggdrasil, one folder each under apps/"
requires-python = ">=3.12"
dependencies = [
  "shiny[theme]>=1.6.2,<2",
  "shinywidgets>=0.6",
  "plotly>=6",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "pycountry>=24.6",
  # An analysis repo plugs in as a path dependency: the app imports its
  # code from the box's checkout, never a copy (see [tool.uv.sources]).
  "wbg_portfolio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repo itself is the `kit` package (page frame, tiles, charts, the
# database), installed editable into .venv so every app can `import kit`.
[tool.hatch.build.targets.wheel]
packages = ["kit"]

[tool.uv]
package = true

[tool.uv.sources]
wbg_portfolio = { path = "/ygg/projects/wbg-digital-resilience", editable = true }
